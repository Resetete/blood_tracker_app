default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  timeout: 5000

development:
  <<: *default
  database: blood_tracker_app_development

test:
  <<: *default
  database: blood_tracker_app_test

production:
  <<: *default
  database: <%= ENV['DATABASE_URL'] %>
